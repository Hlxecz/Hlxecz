name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"  
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Hlxecz
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=#f5f5f5&color_dots=#202020,#404040,#666666,#949494,#c9c9c9
            dist/github-contribution-grid-snake.svg?color_snake=#262626&color_dots=#eeeeee,#d4d4d4,#a3a3a3,#737373,#404040
      - name: Generate Activity and Stats
        run: node .github/scripts/activity.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: Hlxecz

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
