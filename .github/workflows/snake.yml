name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"  
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Hlxecz
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=#d6b7a7&color_dots=#1b2027,#2c3b35,#42594c,#658472,#94b39e
            dist/github-contribution-grid-snake.svg?color_snake=#9c8073&color_dots=#edefeb,#d8e3db,#b8c9bf,#90a899,#668671
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
