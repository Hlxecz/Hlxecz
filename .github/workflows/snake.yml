name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"  
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Hlxecz
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=#38bdf8&color_dots=#161b22,#272c34,#373e48,#4b5563,#6b7280
            dist/github-contribution-grid-snake.svg?color_snake=#0369a1&color_dots=#e5e7eb,#cbd5e1,#94a3b8,#64748b,#475569
            dist/github-contribution-grid-snake-contrast-dark.svg?color_snake=#38bdf8&color_dots=#161b22,#272c34,#373e48,#4b5563,#6b7280
            dist/github-contribution-grid-snake-contrast.svg?color_snake=#0369a1&color_dots=#e5e7eb,#cbd5e1,#94a3b8,#64748b,#475569

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
